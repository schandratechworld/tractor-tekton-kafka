apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: tractor-ci
spec:
  workspaces:
    - name: shared-workspace

  tasks:
    - name: clone-source
      taskRef:
        name: git-clone
      params:
        - name: url
          value: https://github.com/schandratechworld/tractor-tekton-kafka.git
        - name: revision
          value: main
      workspaces:
        - name: output
          workspace: shared-workspace

    - name: run-unit-tests
      runAfter:
        - clone-source
      taskRef:
        name: python-test
      workspaces:
        - name: source
          workspace: shared-workspace
