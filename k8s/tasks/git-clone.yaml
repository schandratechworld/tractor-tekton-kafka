apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
spec:
  params:
    - name: url
      type: string
    - name: revision
      type: string
      default: main
  workspaces:
    - name: output
  steps:
    - name: clone
      image: alpine/git:2.47.2
      workingDir: $(workspaces.output.path)
      env:
        - name: GIT_URL
          value: $(params.url)
        - name: GIT_REVISION
          value: $(params.revision)
      script: |
        #!/bin/sh
        set -eu
        git clone "$GIT_URL" source
        cd source
        git checkout "$GIT_REVISION"
        echo "Repository cloned successfully"
        git log -1 --oneline
